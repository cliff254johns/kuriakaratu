name: Validate and deploy Firestore security rules

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/test-firestore-rules.mjs'
      - '.github/workflows/firestore-rules.yml'
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/test-firestore-rules.mjs'
      - '.github/workflows/firestore-rules.yml'

jobs:
  firestore-emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing firebase
      - name: Run Firestore rules emulator tests
        run: npx firebase emulators:exec --only firestore --project demo-kuriakaratu "node scripts/test-firestore-rules.mjs"

  deploy-firestore-rules:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: firestore-emulator-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Firestore rules when Firebase credentials are configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KURIAKARATU }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::Firestore emulator tests passed. Live deployment skipped because FIREBASE_SERVICE_ACCOUNT_KURIAKARATU is not configured."
            exit 0
          fi
          npm install --global firebase-tools
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only firestore:rules --project kuriakaratu-b5c90 --non-interactive
