name: Validate legal portal changes

on:
  pull_request:
  push:
    branches:
      - main
      - security/**
      - fix/unified-practice-tracker

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse application JavaScript and run static security checks
        run: node scripts/check-portal-syntax.mjs
